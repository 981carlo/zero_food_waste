{% extends "base.html" %}

{% block title %}
Registro - Zero Food Waste
{% endblock %}

{% block content %}
<h2>Crear Cuenta</h2>

<form method="post">
  {% csrf_token %}

  {{ form.as_p }}
  <p>  
    <button type="submit">Registrarse</button>
    <a class="button-link secondary-button" href="{% url 'inicio' %}">
      Volver al inicio
    </a>
  </p>
</form>


{% endblock %}
