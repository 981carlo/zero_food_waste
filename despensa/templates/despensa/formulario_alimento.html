{% extends "base.html" %}

{% block title %}
{{ titulo|default:"Nuevo alimento" }} - Zero Food Waste
{% endblock %}

{% block content %}
<h2>{{ titulo|default:"Nuevo alimento" }}</h2>

<form method="post" novalidate>
  {% csrf_token %}

  {{ form.as_p }}

  <p>
    <button type="submit">{{ texto_boton|default:"Guardar alimento" }}</button>
    <a class="button-link secondary-button" href="{% url 'despensa:listado_alimentos' %}">
      Volver al listado
    </a>
  </p>
</form>
{% endblock %}
